name: "🚀 管理画面から一般公開PWAへ反映"
run-name: "Admin public release • ${{ inputs.request_id }} • ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Supabase public deployment request UUID"
        required: true
        type: string
      release_id:
        description: "AAS app release UUID"
        required: true
        type: string
      source_branch:
        description: "Approved source branch"
        required: true
        type: string
      source_sha:
        description: "Verified Production Canary source SHA"
        required: true
        type: string
      canary_run_id:
        description: "GitHub Actions run ID that produced the verified Canary artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aas-admin-public-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_WRITE_LOGS: "false"

    steps:
      - name: Validate verified Canary release request
        id: target
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUEST_ID" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo 'Invalid deployment request UUID.' >&2
            exit 1
          fi
          if ! printf '%s' "$RELEASE_ID" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo 'Invalid release UUID.' >&2
            exit 1
          fi
          case "$SOURCE_BRANCH" in
            main|preview/current) ;;
            *) echo 'Invalid approved source branch.' >&2; exit 1 ;;
          esac
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'Verified Canary SHA must be an exact lowercase 40-character Git commit SHA.' >&2
            exit 1
          fi
          if ! printf '%s' "$CANARY_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo 'Invalid Canary GitHub Actions run ID.' >&2
            exit 1
          fi

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "Required Actions secret is unavailable: $name" >&2
              exit 1
            fi
          done

      - name: Checkout repository for source verification only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Canary source commit still exists
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "Verified Canary source commit: $SOURCE_SHA"

      - name: Download exact Canary-tested release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aas-release-bundle-${{ inputs.source_sha }}
          path: release-artifact
          run-id: ${{ inputs.canary_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and extract exact Canary artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f release-artifact/release-bundle.tgz
          test -f release-artifact/release-bundle.tgz.sha256
          (
            cd release-artifact
            sha256sum -c release-bundle.tgz.sha256
          )
          rm -rf release-workdir
          mkdir -p release-workdir
          tar -xzf release-artifact/release-bundle.tgz -C release-workdir
          test -f release-workdir/.release-bundle-manifest.json
          test -f release-workdir/package-lock.json

      - name: Validate release bundle manifest
        id: bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifestPath = 'release-workdir/.release-bundle-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.source_sha !== process.env.SOURCE_SHA) throw new Error('Artifact source SHA mismatch');
          if (manifest.public_url !== 'https://ai-article-studio-pwa.ai-article-studio.workers.dev/') throw new Error('Unexpected public URL');
          if (manifest.canary_url !== 'https://ai-article-studio-pwa-canary.ai-article-studio.workers.dev/') throw new Error('Unexpected Canary URL');
          const configPath = path.join('release-workdir', manifest.public_config);
          if (!fs.existsSync(configPath)) throw new Error('Public Wrangler config missing from artifact');
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (config.name !== 'ai-article-studio-pwa') throw new Error('Unexpected production Worker name');
          if (config.workers_dev !== true || config.preview_urls !== false) throw new Error('Invalid public Worker routing contract');
          if (config.route || (Array.isArray(config.routes) && config.routes.length > 0)) throw new Error('Custom routes must remain absent');
          if (/sb_secret_|service[_-]?role/i.test(JSON.stringify(config))) throw new Error('Forbidden secret marker in artifact config');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'public_config=' + configPath + '\n');
          console.log('Exact Canary artifact manifest: PASS');
          NODE

      - name: Setup Node for Wrangler only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: release-workdir/package-lock.json

      - name: Install locked deployment dependencies without rebuilding
        working-directory: release-workdir
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency audit
        working-directory: release-workdir
        run: npm audit --audit-level=moderate

      - name: Verify Cloudflare authentication
        working-directory: release-workdir
        run: npx wrangler whoami --json >/dev/null

      - name: Exact-artifact public deployment dry-run
        working-directory: release-workdir
        env:
          CONFIG_PATH: ../${{ steps.bundle.outputs.public_config }}
        run: |
          set -euo pipefail
          rm -rf .admin-public-dry-run
          npx wrangler deploy             --dry-run             --config "$CONFIG_PATH"             --outdir .admin-public-dry-run
          test -d .admin-public-dry-run

      - name: Deploy exact Canary-tested artifact to general-public Worker
        id: deploy
        working-directory: release-workdir
        env:
          CONFIG_PATH: ../${{ steps.bundle.outputs.public_config }}
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/aas-admin-public-deploy.txt"
          npx wrangler deploy             --config "$CONFIG_PATH"             --keep-vars             --message "AAS verified Canary promotion ${{ inputs.request_id }} ${{ inputs.source_sha }}"             2>&1 | tee "$output_file"
          production_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' "$output_file" | tail -n 1 || true)"
          production_url="${production_url%\)}"
          production_url="${production_url%\]}"
          if [ "$production_url" != "https://ai-article-studio-pwa.ai-article-studio.workers.dev" ] &&              [ "$production_url" != "https://ai-article-studio-pwa.ai-article-studio.workers.dev/" ]; then
            echo "Unexpected Production URL: ${production_url:-<missing>}" >&2
            exit 1
          fi
          echo 'General-public PWA deployed from exact verified Canary artifact.'

      - name: Write deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## AAS verified Canary promotion'
            echo
            echo '- Request: ${{ inputs.request_id }}'
            echo '- Release: ${{ inputs.release_id }}'
            echo '- Verified source SHA: ${{ inputs.source_sha }}'
            echo '- Canary run: ${{ inputs.canary_run_id }}'
            echo '- Bundle: aas-release-bundle-${{ inputs.source_sha }}'
            echo '- Public PWA: https://ai-article-studio-pwa.ai-article-studio.workers.dev/'
            echo '- No rebuild was performed during public promotion'
            echo '- Custom domain / DNS: unchanged'
            echo '- Stripe LIVE: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
