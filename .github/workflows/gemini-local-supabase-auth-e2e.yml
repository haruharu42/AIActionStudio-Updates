name: Gemini local Supabase Auth E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260930125200_knowledge_gemini_free_agent_v1.sql"
      - "supabase/tests/gemini-free/full-stack-**"
      - ".github/workflows/gemini-local-supabase-auth-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Build isolated local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/aas-gemini-auth-e2e"
          mkdir -p "$TEST_ROOT"
          cd "$TEST_ROOT"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/tests/gemini-free/full-stack-base.sql" \
            supabase/migrations/20260930125100_gemini_auth_e2e_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/20260930125200_knowledge_gemini_free_agent_v1.sql" \
            supabase/migrations/20260930125200_knowledge_gemini_free_agent_v1.sql
          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Start disposable full Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          supabase start

      - name: Verify real local Auth JWT and Vault gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          supabase status -o env > local.env
          set -a
          # shellcheck disable=SC1091
          source local.env
          set +a
          bash "$GITHUB_WORKSPACE/supabase/tests/gemini-free/full-stack-auth-e2e.sh"

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [[ -n "${TEST_ROOT:-}" && -d "$TEST_ROOT" ]]; then
            cd "$TEST_ROOT"
            supabase stop --no-backup || true
          fi
