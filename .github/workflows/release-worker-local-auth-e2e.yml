name: Release Worker local Supabase Auth E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/pwa-release-deploy/**"
      - "supabase/tests/release-worker-local/**"
      - ".github/workflows/release-worker-local-auth-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-release-worker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Build isolated local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/aas-release-worker-e2e"
          mkdir -p "$TEST_ROOT"
          cd "$TEST_ROOT"
          supabase init
          mkdir -p supabase/migrations supabase/functions/pwa-release-deploy
          cp "$GITHUB_WORKSPACE/supabase/tests/release-worker-local/base.sql"             supabase/migrations/20261001000100_release_worker_auth_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/functions/pwa-release-deploy/index.ts"             supabase/functions/pwa-release-deploy/index.ts
          cat >> supabase/config.toml <<'EOF'
          [functions.pwa-release-deploy]
          verify_jwt = true
          EOF
          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"

      - name: Start disposable full Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          supabase start

      - name: Start local release Edge Function
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          : > empty.env
          nohup supabase functions serve pwa-release-deploy --env-file empty.env             > "$RUNNER_TEMP/release-function.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/release-function.pid"
          for i in {1..30}; do
            if curl --silent --output /dev/null               "http://127.0.0.1:54321/functions/v1/pwa-release-deploy"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/release-function.log" >&2 || true
          exit 1

      - name: Verify real local Auth gate and read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          supabase status -o env > local.env
          set -a
          # shellcheck disable=SC1091
          source local.env
          set +a
          bash "$GITHUB_WORKSPACE/supabase/tests/release-worker-local/auth-e2e.sh"

      - name: Show function log on failure
        if: failure()
        shell: bash
        run: cat "$RUNNER_TEMP/release-function.log" || true

      - name: Stop disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/release-function.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/release-function.pid")" 2>/dev/null || true
          fi
          if [[ -n "${TEST_ROOT:-}" && -d "$TEST_ROOT" ]]; then
            cd "$TEST_ROOT"
            supabase stop --no-backup || true
          fi
