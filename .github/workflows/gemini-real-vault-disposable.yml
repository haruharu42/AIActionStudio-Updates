name: Gemini real Vault disposable smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260930125200_knowledge_gemini_free_agent_v1.sql"
      - "supabase/tests/gemini-free/real-vault-**"
      - ".github/workflows/gemini-real-vault-disposable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-vault-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: supabase/postgres:17.6.1.173
        env:
          POSTGRES_PASSWORD: local-only-not-production
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-only-not-production
      PGDATABASE: postgres
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert built-in auth.uid is available
        run: |
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT case when to_regprocedure('auth.uid()') is null then 1/0 else 1 end;"
      - name: Initialize real Vault and disposable Auth mock
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/gemini-free/real-vault-fixture.sql
      - name: Apply unchanged Gemini staged migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260930125200_knowledge_gemini_free_agent_v1.sql
      - name: Check authorization quota and UTC rollover
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/gemini-free/smoke.sql
      - name: Check encrypted-at-rest Vault and unauthorized writes
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/gemini-free/real-vault-check.sql
